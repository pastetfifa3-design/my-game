        #ui-container { position: absolute; bottom: 20px; left: 20px; color: white; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px; pointer-events: none; border: 1px solid #c9a063; }

        #station-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 450px; background: #2c251e; color: #f4ecd8; border: 3px solid #c9a063; border-radius: 12px; padding: 25px; box-shadow: 0 0 30px rgba(0,0,0,0.8); z-index: 10; }

        /* Тест */
        #quiz-section { display: none; background: #3a3127; padding: 15px; border-radius: 8px; margin-top: 15px; border-left: 4px solid #c9a063; }
        .quiz-btn { display: block; width: 100%; text-align: left; background: #4a3f32; border: 1px solid #6b5947; color: white; padding: 10px; margin: 8px 0; cursor: pointer; border-radius: 5px; transition: 0.2s; }
        .quiz-btn:hover { background: #c9a063; color: black; font-weight: bold; }
        #quiz-feedback { margin-top: 10px; font-weight: bold; font-size: 15px; }

        /* Кнопки управления модалки */
        .action-container { display: flex; justify-content: space-between; margin-top: 20px; }
        .main-btn { background: #c9a063; border: none; color: black; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 5px; font-size: 14px; }
        .main-btn:hover { background: #e0b77d; }
        .close-btn { background: #5a4a3a; color: #f4ecd8; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; }
        .close-btn:hover { background: #7c6752; }

        /* Прицел */
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.5); transform: translate(-50%, -50%); pointer-events: none; border: 1px solid black; }
        
        /* Сообщение-подсказка по центру */
        #prompt { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 18px; font-weight: bold; text-shadow: 2px 2px 4px #000; background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 5px; display: none; pointer-events: none; }
    </style>
    <!-- Подключаем библиотеку Three.js -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="crosshair"></div>

        <div class="control-item"><b>Мышь</b> — Осмотреться вокруг</div>
        <div class="control-item"><b>Клик по экрану</b> — Захват мыши</div>

                correct: 0
            }
        };

        let activeStationId = null;

        // Сцена Three.js
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xb0d0ff); // Небо
        scene.fog = new THREE.FogExp2(0xb0d0ff, 0.015);

        // Камера
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Свет
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfffaed, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Земля (Брусчатка старого города)
        const groundGeo = new THREE.PlaneGeometry(300, 300);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Генерация европейского мини-городка 18 века
        function createHouse(x, z, h, color) {
            const group = new THREE.Group();
            
            // Стены
            const bodyGeo = new THREE.BoxGeometry(8, h, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.6 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = h / 2;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            // Крыша (треугольная / фахверковый стиль)
            const roofGeo = new THREE.ConeGeometry(6.5, 5, 4);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x8b3a3a, roughness: 0.7 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.y = h + 2.5;
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            group.add(roof);

            // Дверь
            const doorGeo = new THREE.BoxGeometry(2, 3.5, 0.2);
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x3d2314 });
            const door = new THREE.Mesh(doorGeo, doorMat);
            door.position.set(0, 1.75, 4.01);
            group.add(door);

            group.position.set(x, 0, z);
            scene.add(group);
        }

        // Строим улочки города
        const houseColors = [0xdfd5c6, 0xcebba4, 0xbfa88f, 0xdfc29f];
        for (let i = -5; i <= 5; i++) {
            for (let j = -5; j <= 5; j++) {
                // Оставляем центр и дороги пустыми
                if (Math.abs(i) > 1 && Math.abs(j) > 1 && (i+j)%2 === 0) {
                    const height = 10 + Math.random() * 6;
                    const col = houseColors[Math.floor(Math.random() * houseColors.length)];
                    createHouse(i * 22, j * 22, height, col);
                }
            }
        }
